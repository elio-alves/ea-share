name: Release

# Triggered either by pushing a version tag directly:
#   git tag v0.1.0 && git push origin v0.1.0
# or by publishing a release through the GitHub UI ("Draft a new
# release", typing a new tag, Publish release). Both trigger types are
# needed: creating a tag *through the release UI/API* does not fire a
# `push` event (a GitHub quirk - only an actual `git push` of the tag
# does), so relying on `push` alone silently skips building/attaching
# binaries for any release made from the website instead of the CLI.
#
# Windows only for now (ea-share-target.exe, ea-share-controller.exe,
# ea-share-tray.exe) - the project's primary platform per ai-context.md.
# Linux artifacts can be added as a parallel job later without touching
# this one.

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-windows:
    name: build + publish (windows)
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Git Bash is on PATH
        # The self-hosted runner service's PATH doesn't include Git's bin
        # dir, so `shell: bash` steps below can't find bash.exe otherwise.
        shell: pwsh
        run: echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        shell: bash
        run: go vet -unsafeptr=false ./...

      - name: Test
        shell: bash
        run: go test ./...

      - name: Build windows binaries (target, controller, tray)
        shell: bash
        run: ./scripts/build.sh --os windows

      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          out="ea-share-${version}-windows-amd64.zip"
          # zip(1) isn't installed on the self-hosted runner; Compress-Archive
          # is always available on Windows and produces an equivalent zip.
          powershell.exe -NoProfile -Command "Compress-Archive -Path 'bin/ea-share-target.exe','bin/ea-share-controller.exe','bin/ea-share-tray.exe' -DestinationPath '${out}' -Force"
          sha256sum "${out}" > "${out}.sha256"
          echo "archive=${out}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          generate_release_notes: true
