name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        # -unsafeptr=false: this codebase talks to the Win32 API directly
        # via syscall.Proc.Call(), which always returns a uintptr that
        # must then be cast to unsafe.Pointer - vet's unsafeptr analyzer
        # can't prove that's safe across the call boundary and flags it
        # unconditionally. It's inherent to this style of raw-syscall
        # code (see docs/known-issues.md), not an actual bug.
        run: go vet -unsafeptr=false ./...

      - name: Test
        run: go test ./...

  build:
    name: build (windows + linux)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build target/controller (windows+linux) and tray (windows)
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ea-share-binaries
          path: bin/
          if-no-files-found: error
